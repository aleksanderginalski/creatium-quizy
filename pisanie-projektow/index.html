}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Oswald',sans-serif;color:var(--ink);background:var(--brand-dk);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}

/* ---------- tło: gradient marki + bloby Fala + pływające kropki ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(135deg,var(--brand-dk) 0%,var(--brand) 55%,var(--brand-2) 100%)}
.bgfx::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .5s;
  background:radial-gradient(90% 55% at 50% 22%,var(--glow,transparent),transparent 70%)}
body.fx-ok .bgfx::after{--glow:rgba(74,157,63,.45);opacity:1}
body.fx-bad .bgfx::after{--glow:rgba(216,69,58,.42);opacity:1}
body.fx-time .bgfx::after{--glow:rgba(183,198,220,.25);opacity:1}
.blob{position:absolute;fill:var(--accent);filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.blob.tl{width:250px;height:140px;left:-86px;top:-46px;transform:rotate(-6deg)}
.blob.br{width:270px;height:150px;right:-104px;bottom:-62px;transform:rotate(172deg)}
.atom{position:fixed;z-index:3;left:14px;top:calc(10px + var(--safe-t));width:50px;height:44px;background:#fff;
  -webkit-mask:var(--atom) center/contain no-repeat;mask:var(--atom) center/contain no-repeat;pointer-events:none}
.dot{position:absolute;border-radius:50%;opacity:.38;animation:floaty var(--t,9s) ease-in-out infinite alternate}
@keyframes floaty{to{transform:translate(var(--x,20px),var(--y,-40px))}}

/* ---------- układ ---------- */
.app{position:relative;z-index:1;max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(14px + var(--safe-t)) 16px calc(22px + var(--safe-b));display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;gap:14px}
.screen.on{display:flex;animation:scrIn .42s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:44px;padding-left:66px}
.sound{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid var(--line);
  display:grid;place-items:center;position:fixed;z-index:4;right:14px;top:calc(12px + var(--safe-t))}
.sound svg{width:22px;height:22px;fill:#fff}
.sound .off{display:none}.sound[aria-pressed=false] .on{display:none}.sound[aria-pressed=false] .off{display:block}

.eyebrow{color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:2.2px;font-size:15px}
.title{font-weight:700;font-size:clamp(42px,12vw,68px);line-height:.98;letter-spacing:.3px}
.title .hi,.hi{color:var(--accent)}
.sub{color:var(--muted);font-size:clamp(18px,4.8vw,22px);font-weight:400;line-height:1.25}
.center{text-align:center}

/* ---------- grafika na białej Fali (wariant quizu D-19/D-20: postać wyrasta z Fali i wyskakuje) ---------- */
.hero{position:relative;width:min(100%,400px);margin:4px auto 0;height:var(--h,240px);flex:none}
.hero .fala{position:absolute;left:-9%;width:118%;bottom:0;height:64%;fill:#fff;
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.38))}
.hero .pop{position:absolute;left:5%;right:5%;top:-8%;bottom:15%;overflow:hidden}
.hero .pop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;
  transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(#000 86%,transparent 100%);mask-image:linear-gradient(#000 86%,transparent 100%);
  filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff);
  animation:hop 1s .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes hop{0%{transform:translateY(104%)}52%{transform:translateY(-6%) scaleY(1.05)}70%{transform:translateY(1.5%) scaleY(.96)}
  85%{transform:translateY(-1%) scaleY(1.01)}100%{transform:none}}

/* ---------- start ---------- */
#s-start{gap:13px}
#s-start .hero{--h:clamp(120px,21vh,250px)}
@media (max-height:760px){#s-start{gap:10px}#s-start .topbar{min-height:30px}#s-start .hero{--h:clamp(100px,17vh,160px)}}
@media (max-height:700px){#s-start{gap:8px}#s-start .hero{--h:84px}#s-start .sub{font-size:17px}#s-start .field span{display:none}}
.field{display:flex;flex-direction:column;gap:6px}
.field span{color:var(--muted);font-size:16px}
.field input{width:100%;font-size:22px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.08);
  border:2px solid var(--line);outline:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder{color:rgba(183,198,220,.55)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(251,176,22,.22)}
.sub b{color:#fff;font-weight:600}
.rounds{display:grid;gap:8px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.chip{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1px 10px;text-align:left;padding:10px 15px;
  border-radius:16px;background:var(--bg);border:2px solid var(--line);transition:border-color .2s,background-color .2s,box-shadow .2s}
.chip .lab{grid-column:1;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.chip .tt{grid-column:1;font-size:21px;font-weight:600;line-height:1.12}
.chip .meta{grid-column:2;grid-row:1/3;color:var(--muted);font-size:16px;text-align:right}
.parts .chip{grid-template-columns:1fr;align-content:start;padding:9px 11px}
.parts .chip .tt{font-size:17px}
.parts .chip .meta{grid-column:1;grid-row:auto;text-align:left;font-size:14px}
.chip[aria-checked=true]{border-color:var(--accent);background:#17467f;box-shadow:0 0 0 4px rgba(251,176,22,.2)}
.record{color:var(--muted);font-size:17px;text-align:center;min-height:1em}
.record b{color:var(--accent);font-weight:600}

/* ---------- przyciski ---------- */
.btn{display:block;width:100%;font-weight:600;font-size:24px;letter-spacing:.4px;padding:15px 18px;border-radius:16px;
  transition:transform .08s,box-shadow .08s}
.btn.primary{background:var(--accent);color:var(--brand);box-shadow:0 6px 0 var(--accent-dk),0 12px 26px rgba(0,0,0,.35)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-dk),0 6px 14px rgba(0,0,0,.3)}
.btn.ghost{background:transparent;color:#fff;border:2px solid var(--line)}
.btn.ghost:active{transform:translateY(2px)}
.btnrow{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.btn.pulse{animation:btnPulse 1.6s ease-in-out infinite}
@keyframes btnPulse{50%{box-shadow:0 6px 0 var(--accent-dk),0 0 0 10px rgba(251,176,22,.18),0 12px 26px rgba(0,0,0,.35)}}

/* ---------- wejście w część ---------- */
#s-round{justify-content:center;text-align:center;gap:12px}
#s-round .hero{--h:clamp(190px,34vh,320px)}
.count{font-size:96px;font-weight:700;color:var(--accent);line-height:1;height:100px}
.count.tick{animation:countPop .62s cubic-bezier(.2,.9,.3,1.4)}
@keyframes countPop{0%{transform:scale(2.2);opacity:0}40%{opacity:1}100%{transform:scale(1)}}

/* ---------- pasek gry ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 54px 0 66px}
.pill{background:rgba(8,31,68,.85);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:18px;font-weight:600;white-space:nowrap}
.pill.score{color:var(--accent);display:flex;align-items:center;gap:6px}
.pill.score svg{width:18px;height:18px;fill:var(--accent)}
.pill.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}

/* ---------- pytanie ---------- */
.qcard{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;
  box-shadow:0 14px 30px rgba(0,0,0,.35);display:grid;grid-template-columns:1fr 66px;gap:10px 12px;align-items:start}
.qtext{font-size:clamp(23px,6.2vw,32px);font-weight:600;line-height:1.17}
.timer{position:relative;width:66px;height:66px}
.timer svg{width:66px;height:66px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:7}
.timer .tr-bg{stroke:rgba(255,255,255,.14)}
.timer .tr{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:175.93;stroke-dashoffset:0}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700}
.timer.hot .tr{stroke:var(--warn)}
.timer.hot{animation:hot .5s ease-in-out infinite alternate}
@keyframes hot{to{transform:scale(1.1)}}
.readbar{grid-column:1/3;height:7px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.readbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px}
.readbar.run i{width:100%;transition:width var(--read,1600ms) linear}
.readbar.done{visibility:hidden}

.answers{display:grid;gap:10px}
@media (min-width:700px){.answers{grid-template-columns:1fr 1fr}.answers .ans{min-height:92px}}
.ans{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:64px;
  border-radius:16px;font-size:clamp(19px,5vw,23px);font-weight:500;line-height:1.15;color:#fff;
  background:var(--c);box-shadow:0 5px 0 var(--cd),0 10px 18px rgba(0,0,0,.25);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s,box-shadow .1s}
.ans.light{color:var(--brand)}
.ans .shape{flex:none;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.18);display:grid;place-items:center}
.ans .shape svg{width:22px;height:22px;fill:#fff}
.ans.light .shape{background:rgba(12,44,94,.12)}.ans.light .shape svg{fill:var(--brand)}
.ans .at{flex:1}
.ans .mark{flex:none;width:30px;height:30px;display:none}
.ans .mark svg{width:30px;height:30px}
.answers:not(.live) .ans{opacity:0;transform:translateY(18px) scale(.97);pointer-events:none}
.answers.live .ans{transition-delay:calc(var(--d) * 70ms)}
.answers.locked .ans{pointer-events:none;transition-delay:0s}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.ans.dim{opacity:.32;filter:saturate(.35)}
.ans.right{outline:4px solid #fff;outline-offset:2px;transform:scale(1.02)}
.ans.right .mark,.ans.wrong .mark{display:block}
.ans.wrong{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.a0{--c:var(--a0);--cd:var(--a0d)}.a1{--c:var(--a1);--cd:var(--a1d)}.a2{--c:var(--a2);--cd:var(--a2d)}
.a3{--c:var(--a3);--cd:var(--a3d)}.a4{--c:var(--a4);--cd:var(--a4d)}
.fly{position:fixed;z-index:20;font-weight:700;font-size:34px;color:var(--accent);pointer-events:none;
  text-shadow:0 3px 0 var(--brand-dk);animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}

/* ---------- feedback ---------- */
#s-fb{gap:12px}
#s-fb .hero{--h:clamp(130px,21vh,200px)}
.verdict{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(40px,11vw,56px);font-weight:700;line-height:1;
  animation:verdict .55s cubic-bezier(.2,.9,.3,1.4)}
.verdict .vi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.verdict .vi svg{width:30px;height:30px;fill:#fff}
.verdict.ok .vi{background:var(--ok)}.verdict.bad .vi{background:var(--warn)}.verdict.time .vi{background:var(--brand-2)}
@keyframes verdict{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.pts{display:flex;flex-direction:column;align-items:center;gap:2px}
.pts b{font-size:clamp(54px,15vw,72px);font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.pts span{color:var(--muted);font-size:17px;min-height:1.2em}
.pts.zero b{color:var(--muted)}
.streak{align-self:center;display:none;align-items:center;gap:8px;background:var(--accent);color:var(--brand);
  border-radius:999px;padding:6px 16px 6px 10px;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--accent-dk)}
.streak.on{display:flex;animation:verdict .5s .25s cubic-bezier(.2,.9,.3,1.4) both}
.streak svg{width:24px;height:24px;fill:var(--warn)}
.correct{display:none;flex-direction:column;gap:6px}
.correct.on{display:flex}
.correct .lab{color:var(--muted);font-size:16px}
.correct .ans{pointer-events:none;min-height:56px}
.expl{background:var(--accent);color:var(--brand);border-radius:16px;padding:13px 16px;font-size:clamp(18px,4.8vw,21px);
  line-height:1.25;font-weight:400;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.expl b{font-weight:700}
#s-fb .btn{margin-top:auto}

/* ---------- wynik ---------- */
#s-end{gap:12px;text-align:center;padding-top:50px}
#s-end .hero{--h:clamp(150px,24vh,240px)}
.nickline{font-size:clamp(26px,7vw,34px);font-weight:600}
.bigscore b{display:block;font-size:clamp(72px,21vw,104px);font-weight:700;color:var(--accent);line-height:.95;font-variant-numeric:tabular-nums}
.bigscore span{color:var(--muted);font-size:18px;letter-spacing:2px;text-transform:uppercase}
.rank{font-size:clamp(25px,6.6vw,32px);font-weight:700;line-height:1.1}
.rank small{display:block;font-size:18px;font-weight:400;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 4px}
.stat b{display:block;font-size:30px;font-weight:700;color:var(--accent);line-height:1.1}
.stat span{font-size:15px;color:var(--muted)}
.newrec{display:inline-block;background:var(--ok);color:#fff;border-radius:999px;padding:3px 12px;font-weight:600;margin-left:6px}
.hint{color:var(--muted);font-size:16px}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

  <!-- START -->

  <!-- PO ODPOWIEDZI -->

  </section>

btnSound.addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); paintSound(); if(soundOn) SFX.count(); });
paintSound();

/* ---- ekrany ---- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  document.body.classList.remove('fx-ok','fx-bad','fx-time');
  window.scrollTo(0, 0);
}
let heroN = 0;
function hero(el, key){
  const src = QUIZ.img[key];
  if(!src){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = '<svg class="fala" viewBox="0 0 280 156" preserveAspectRatio="none" aria-hidden="true"><path d="' + FALA[(heroN++) % FALA.length] + '"/></svg>'
    + '<div class="pop"><img alt="" src="' + src + '"></div>';
}
function countUp(el, from, to, ms, prefix){
  const t0 = performance.now(); prefix = prefix || '';
  if(reduced || ms <= 0){ el.textContent = prefix + fmt(to); return; }
  (function step(t){ const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    el.textContent = prefix + fmt(from + (to - from) * e); if(p < 1) requestAnimationFrame(step); })(t0);
}
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const streakBonus = k => Math.min(500, 100 * (k - 1));
const maxScore = n => { let m = 0; for(let k = 1; k <= n; k++) m += 1000 + streakBonus(k); return m; };
function tileHTML(o, k, extra){
  const light = k === 2 || k === 4;
  return '<button class="ans a' + k + (light ? ' light' : '') + (extra || '') + '" data-k="' + k + '" style="--d:' + k + '">'
    + '<span class="shape"><svg viewBox="0 0 24 24">' + SHAPE[SHAPES[k]] + '</svg></span>'
    + '<span class="at">' + esc(o.t) + '</span><span class="mark"></span></button>';
}

/* ---- start ---- */
$('#start-title').innerHTML = esc(QUIZ.title).replace(esc(QUIZ.titleHi || ''), '<span class="hi">' + esc(QUIZ.titleHi || '') + '</span>');
$('#rule-time').textContent = T + ' s';
const nickIn = $('#nick'); nickIn.value = store.get('nick', '');
const rounds = QUIZ.rounds;
// Link do jednej części (QR na slajdzie kończącym część): ?czesc=1 otwiera od razu tę część, bez wyboru
const only = (() => { try { const n = new URLSearchParams(location.search).get('czesc'); return rounds.find(r => r.id === 'c' + n) || null; } catch(e){ return null; } })();
// Bez parametru: „Cały quiz” na całą szerokość, części w jednym rzędzie małych kafelków
const choices = only
  ? [{ id: only.id, lab: only.label, tt: only.title, n: only.questions.length, rounds: [only] }]
  : rounds.map(r => ({ id: r.id, lab: r.label.replace(/ z \d+$/, ''), tt: r.title, n: r.questions.length, rounds: [r] }));
if(!only && rounds.length > 1) choices.unshift({ id: 'all', lab: 'Cały quiz', tt: 'Wszystkie części', n: rounds.reduce((s, r) => s + r.questions.length, 0), rounds: rounds });
let sel = only ? only.id : store.get('sel', choices[0].id);
if(!choices.some(c => c.id === sel)) sel = choices[0].id;
const startImg = only ? only.img : QUIZ.imgStart;
if(only) document.title = QUIZ.title + ' · ' + only.label + ' · Quiz';
function paintChoices(){
  const chip = c => '<button class="chip" role="radio" aria-checked="' + (c.id === sel) + '" data-id="' + c.id + '">'
    + '<span class="lab">' + esc(c.lab) + '</span><span class="tt">' + esc(c.tt) + '</span><span class="meta">' + c.n + ' pyt.</span></button>';
  $('#rounds').innerHTML = choices.length > 1
    ? chip(choices[0]) + '<div class="parts">' + choices.slice(1).map(chip).join('') + '</div>'
    : chip(choices[0]);
  const best = store.get('best:' + sel, 0);
  $('#start-record').innerHTML = best ? 'Twój rekord: <b>' + fmt(best) + '</b> pkt' : '';
}
$('#rounds').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b || only) return; sel = b.dataset.id; store.set('sel', sel); paintChoices(); });
paintChoices();
hero($('#hero-start'), startImg);

/* ---- gra ---- */
let S = null, raf = 0, readTimer = 0, lastTick = 0;
function start(){
  ac();
  const nick = (nickIn.value || '').trim().slice(0, 18) || 'Gracz';
  store.set('nick', nickIn.value.trim());
  const choice = choices.find(c => c.id === sel);
  const list = [];
  choice.rounds.forEach(r => r.questions.forEach((q, i) => list.push({ r: r, q: q, iInRound: i })));
  S = { nick: nick, key: choice.id, label: choice.lab + ' · ' + choice.tt, list: list, i: 0, score: 0, streak: 0, best: 0, ok: 0, times: [], lastRound: null };
  next();
}
function next(){
  if(S.i >= S.list.length) return finish();
  const it = S.list[S.i];
  if(it.r !== S.lastRound){ S.lastRound = it.r; roundIntro(it.r, question); }
  else question();
}
function roundIntro(r, cb){
  show('s-round');
  $('#r-label').textContent = r.label;
  $('#r-title').textContent = r.title;
  hero($('#hero-round'), r.img);
  const el = $('#r-count'); let n = 3;
  const beat = () => {
    if(n === 0){ SFX.go(); cb(); return; }
    el.textContent = n; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); SFX.count();
    n--; setTimeout(beat, 750);
  };
  el.textContent = ''; setTimeout(beat, 900);
}
function hud(countEl, scoreEl){
  $(countEl).textContent = (S.i + 1) + ' / ' + S.list.length;
  $(scoreEl).innerHTML = ICON.star + '<span>' + fmt(S.score) + '</span>';
}
function question(){
  const it = S.list[S.i];
  show('s-q'); hud('#q-count', '#q-score');
  $('#qtext').textContent = it.q.q;
  const order = shuffle(it.q.o.map((o, idx) => idx));
  S.order = order; S.answered = false;
  const box = $('#answers');
  box.className = 'answers';
  box.innerHTML = order.map((idx, k) => tileHTML(it.q.o[idx], k)).join('');
  const timer = $('#timer'); timer.classList.remove('hot');
  $('#tr').style.strokeDashoffset = 0; $('#tnum').textContent = T;
  const rb = $('#readbar'); rb.className = 'readbar'; rb.style.setProperty('--read', READ_MS + 'ms');
  void rb.offsetWidth; rb.classList.add('run');
  clearTimeout(readTimer);
  readTimer = setTimeout(() => {
    rb.classList.add('done'); box.classList.add('live');
    S.t0 = performance.now(); lastTick = T; tick();
  }, READ_MS);
}
function tick(){
  const el = (performance.now() - S.t0) / 1000, left = Math.max(0, T - el);
  $('#tr').style.strokeDashoffset = C * (1 - left / T);
  const sec = Math.ceil(left);
  $('#tnum').textContent = sec;
  if(left <= 5) $('#timer').classList.add('hot');
  if(left <= 5 && sec < lastTick && sec > 0){ SFX.tick(); }
  lastTick = sec;
  if(left <= 0){ answer(-1); return; }
  raf = requestAnimationFrame(tick);
}
$('#answers').addEventListener('click', e => {
  const b = e.target.closest('.ans'); if(!b || !$('#answers').classList.contains('live')) return;
  answer(+b.dataset.k, b);
});
function answer(k, btn){
  if(S.answered) return; S.answered = true;
  cancelAnimationFrame(raf);
  const it = S.list[S.i], box = $('#answers');
  box.classList.add('locked');
  const t = k < 0 ? T : Math.min(T, (performance.now() - S.t0) / 1000);
  const chosen = k < 0 ? -1 : S.order[k];
  const correctIdx = it.q.o.findIndex(o => o.ok);
  const ok = chosen === correctIdx;
  let base = 0, bonus = 0;
  if(ok){ S.streak++; S.ok++; base = Math.round(1000 * (1 - (t / T) / 2)); bonus = streakBonus(S.streak); S.best = Math.max(S.best, S.streak); }
  else S.streak = 0;
  if(k >= 0) S.times.push(t);
  const gained = base + bonus; S.score += gained;
  box.querySelectorAll('.ans').forEach((b, kk) => {
    const idx = S.order[kk];
    if(idx === correctIdx){ b.classList.add('right'); b.querySelector('.mark').innerHTML = MARK_OK; }
    else if(kk === k){ b.classList.add('wrong'); b.querySelector('.mark').innerHTML = MARK_BAD; }
    else b.classList.add('dim');
  });
  if(ok){ SFX.ok(); if(btn) flyPoints(btn, gained); }
  else { SFX.bad(); if(navigator.vibrate) try{ navigator.vibrate(k < 0 ? 120 : [60, 40, 60]); }catch(e){} }
  const res = { ok: ok, timeout: k < 0, base: base, bonus: bonus, gained: gained, t: t, it: it, correctIdx: correctIdx, correctK: S.order.indexOf(correctIdx) };
  setTimeout(() => feedback(res), ok ? 900 : 1300);
}
function flyPoints(btn, n){
  const r = btn.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'fly'; f.textContent = '+' + fmt(n);
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top - 6) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1100);
}
function feedback(res){
  show('s-fb'); hud('#f-count', '#f-score');
  const before = S.score - res.gained;
  $('#f-score').querySelector('span').textContent = fmt(before);
  const v = $('#fb-verdict');
  v.className = 'verdict ' + (res.ok ? 'ok' : res.timeout ? 'time' : 'bad');
  $('#fb-icon').innerHTML = res.ok ? ICON.check : res.timeout ? ICON.clock : ICON.x;
  const words = res.ok ? QUIZ.words.ok : res.timeout ? QUIZ.words.time : QUIZ.words.bad;
  $('#fb-word').textContent = words[Math.floor(Math.random() * words.length)];
  document.body.classList.add(res.ok ? 'fx-ok' : res.timeout ? 'fx-time' : 'fx-bad');
  hero($('#hero-fb'), res.ok ? QUIZ.imgOk : res.timeout ? QUIZ.imgTime : QUIZ.imgBad);
  const pts = $('#fb-pts'); pts.classList.toggle('zero', !res.ok);
  countUp($('#fb-num'), 0, res.gained, 700, '+');
  $('#fb-break').textContent = res.ok
    ? 'szybkość ' + fmt(res.base) + (res.bonus ? ' · seria +' + fmt(res.bonus) : '') + ' · ' + dec(res.t) + ' s'
    : (res.timeout ? 'Liczy się każda sekunda.' : 'Seria przerwana. Następne pytanie to nowa szansa.');
  const st = $('#fb-streak');
  if(res.ok && S.streak >= 2){ st.innerHTML = ICON.flame + 'Seria ' + S.streak; st.classList.add('on'); SFX.streak(); }
  else st.classList.remove('on');
  const cr = $('#fb-correct');
  if(!res.ok){ cr.classList.add('on'); $('#fb-correct-tile').innerHTML = tileHTML(res.it.q.o[res.correctIdx], res.correctK); }
  else cr.classList.remove('on');
  $('#fb-expl').innerHTML = '<b>Pamiętaj:</b> ' + esc(res.it.q.e || '');
  $('#fb-expl').style.display = res.it.q.e ? '' : 'none';
  const last = S.i === S.list.length - 1;
  const nb = $('#btn-next'); nb.textContent = last ? 'Zobacz wynik' : 'Dalej';
  setTimeout(() => { const sc = $('#f-score'); countUp(sc.querySelector('span'), before, S.score, 600); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }, 350);
}
$('#btn-next').addEventListener('click', () => { S.i++; next(); });

function finish(){
  show('s-end');
  const n = S.list.length, pct = S.score / maxScore(n);
  $('#end-label').textContent = S.label;
  $('#end-nick').textContent = S.nick;
  countUp($('#end-score'), 0, S.score, 1600);
  const R = QUIZ.ranks.find(r => pct >= r.min) || QUIZ.ranks[QUIZ.ranks.length - 1];
  $('#end-rank').innerHTML = esc(R.title) + '<small>' + esc(R.sub) + '</small>';
  hero($('#hero-end'), pct >= .6 ? QUIZ.imgEndHi : QUIZ.imgEndLo);
  $('#st-ok').textContent = S.ok + '/' + n;
  $('#st-time').textContent = S.times.length ? dec(S.times.reduce((a, b) => a + b, 0) / S.times.length) + ' s' : 'brak';
  $('#st-streak').textContent = S.best;
  const key = 'best:' + S.key, prev = store.get(key, 0);
  if(S.score > prev){ store.set(key, S.score); $('#end-record').innerHTML = prev ? 'Poprzedni rekord: <b>' + fmt(prev) + '</b><span class="newrec">Nowy rekord!</span>' : ''; }
  else $('#end-record').innerHTML = 'Twój rekord: <b>' + fmt(prev) + '</b> pkt';
  SFX.end();
  setTimeout(() => confetti(pct >= .6 ? 220 : 110), 300);
}
$('#btn-again').addEventListener('click', start);
$('#btn-home').addEventListener('click', () => { paintChoices(); hero($('#hero-start'), startImg); show('s-start'); });
$('#btn-start').addEventListener('click', start);
nickIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); start(); } });
document.addEventListener('keydown', e => {
  const on = document.querySelector('.screen.on'); if(!on || e.target === nickIn) return;
  if(on.id === 's-q' && /^[1-5]$/.test(e.key)){ const b = $('#answers').querySelectorAll('.ans')[+e.key - 1]; if(b && $('#answers').classList.contains('live')) answer(+e.key - 1, b); }
  if(e.key === 'Enter' || e.key === ' '){ if(on.id === 's-fb'){ e.preventDefault(); $('#btn-next').click(); } }
});

/* ---- konfetti w kolorach marki ---- */
function confetti(count){
  if(reduced) return;
  const cv = $('#confetti'), x = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr; cv.style.display = 'block';
  const cols = ['#fbb016','#ffffff','#d8453a','#2f7fd1','#4a9d3f'];
  // dwa działka z dolnych rogów, strzał w górę i do środka; potem opad
  const P = Array.from({ length: count }, (_, i) => { const left = i % 2 === 0; return {
    x: left ? -10 * dpr : W + 10 * dpr, y: H * (.92 + Math.random() * .08),
    vx: (left ? 1 : -1) * (3 + Math.random() * 9) * dpr * Math.min(1.6, innerWidth / 390),
    vy: (-13 - Math.random() * 11) * dpr * Math.min(1.25, Math.sqrt(innerHeight / 844)),
    w: (7 + Math.random() * 7) * dpr, h: (4 + Math.random() * 5) * dpr,
    a: Math.random() * 6.28, va: (Math.random() - .5) * .35, c: cols[(i >> 1) % cols.length], round: Math.random() < .3 }; });
  const t0 = performance.now();
  (function frame(t){
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .32 * dpr; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c;
      if(p.round){ x.beginPath(); x.arc(0, 0, p.h, 0, 6.28); x.fill(); } else x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.restore(); });
    if(t - t0 < 4200) requestAnimationFrame(frame); else { x.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })(t0);
}
})();
</script>
